[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aircanvas"
version = "0.1.0"
description = "Run 20B+ image & video diffusion models on 4-8 GB GPUs by streaming quantized model blocks from disk."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Kyle Hulley" }]
keywords = [
    "diffusion", "diffusers", "flux", "qwen-image", "wan", "hunyuanvideo",
    "text-to-image", "text-to-video", "image-generation", "video-generation",
    "low-vram", "offloading", "streaming", "quantization", "fp8", "nf4", "airllm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.4",
    "diffusers>=0.35",
    "transformers>=4.49",
    "safetensors>=0.4",
    "accelerate>=1.0",
    "huggingface-hub>=0.30",
    "tqdm",
]

[project.optional-dependencies]
nf4 = ["bitsandbytes>=0.45"]
video = ["imageio[ffmpeg]"]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
aircanvas = "aircanvas.cli:main"

[project.urls]
Homepage = "https://github.com/kyleADHD/AirCanvas"
Repository = "https://github.com/kyleADHD/AirCanvas"
Documentation = "https://github.com/kyleADHD/AirCanvas#readme"
Issues = "https://github.com/kyleADHD/AirCanvas/issues"
Changelog = "https://github.com/kyleADHD/AirCanvas/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aircanvas"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# No python_version pin: mypy checks under the running interpreter, so new
# numpy stubs (PEP 695 `type` statements, 3.12+) parse on modern Pythons;
# 3.10-syntax compatibility is enforced by ruff's target-version instead.
[tool.mypy]
strict = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Optional [nf4] extra — absent in CI and on non-CUDA boxes by design.
module = ["bitsandbytes", "bitsandbytes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import shared helpers as `from tests.conftest import ...`, which needs
# the repo root on sys.path — true for `python -m pytest` but not the bare
# `pytest` script (as CI runs it) without this.
pythonpath = ["."]
markers = [
    "gpu: tests requiring a CUDA GPU (deselected in CI; run with -m gpu)",
    "network: tests that download from the HF Hub (deselected by default; run with -m network)",
]
# Default selection is the offline CPU suite, so a bare `pytest` is green on any
# machine. The other two tiers are opt-in:
#   pytest -m gpu       (needs CUDA)
#   pytest -m network   (needs the Hub; pulls ~1.5 MB of tiny test models)
addopts = "-m 'not gpu and not network'"
