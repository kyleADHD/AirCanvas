name: Feature / model request
description: Ask for a new capability or a new model adapter
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like AirCanvas to do?
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model (for adapter requests)
      placeholder: HF repo id, e.g. some-org/some-dit-model
  - type: textarea
    id: hardware
    attributes:
      label: Your hardware
      placeholder: GPU + VRAM, system RAM, disk type (NVMe/SATA)
