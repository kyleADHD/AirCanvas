name: admin-release

# Temporary: creates the v0.1.0 release (tag on main tip). The maintainer's
# remote session cannot push tag refs through its git proxy, so the release
# is created with the Actions token instead. Note: a release created by
# GITHUB_TOKEN does not fire the `release: published` trigger, so publish.yml
# is dispatched separately on the tag ref. Delete this file after the run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.1.0 release on main
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'First working release. Everything below was verified on a 6 GB RTX 4050',
              'Laptop GPU with 16 GB RAM — measured numbers in',
              '[docs/BENCHMARKS.md](https://github.com/kyleADHD/AirCanvas/blob/main/docs/BENCHMARKS.md).',
              '',
              '## Highlights',
              '- **Qwen-Image 20.4B** generates 1024² images on a 6 GB GPU (~7 min/image) — a model that otherwise needs a 40 GB+ card.',
              '- **Wan 2.1 video**: streamed step time measured at **1.02× full-VRAM** with **byte-identical output** — streaming is effectively free for video.',
              '- **FLUX.1-schnell 12B**: 129 s/image warm (4-step 1024²) on the same 6 GB card.',
              '',
              '## What is in 0.1.0',
              '- **Core**: one-time per-block resharding (fp8/NF4 at split time, alignment verified with the reader\'s own parser, resumable, split-once-delete-original); meta-device streaming engine with pinned ring → CUDA copy stream → GPU slot pools, deterministic schedule prefetch, bitwise-equivalence gate.',
              '- **Pipeline**: phase-aware `AirPipeline` over stock diffusers pipelines — text encoders load-run-evict with a disk embedding cache (or split and streamed themselves when too big to load), streamed DiT, tiled VAE decode, per-call budget re-solve, `report()` with full attribution.',
              '- **Budgeting**: waterfall solver over probed VRAM/RAM/disk bandwidth; resident-block tier, RAM shard-cache tier, `aircanvas doctor`.',
              '- **Models**: FLUX.1, Qwen-Image, SD3/3.5, Wan 2.1, Wan 2.2 dual-expert handover, HunyuanVideo, CogVideoX, generic DiT introspection.',
              '- **Field-hardening**: Windows commit-pressure mmap fallback (ranged reads), computed-buffer adoption, tied-embedding re-tie, honest exit codes and resumability throughout.',
              '',
              '## Install',
              '```bash',
              'pip install aircanvas',
              'aircanvas doctor   # what can THIS box run?',
              '```',
            ].join('\n');
            const rel = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v0.1.0',
              target_commitish: 'main',
              name: 'AirCanvas v0.1.0',
              body,
              draft: false,
              prerelease: false,
            });
            core.info('Release created: ' + rel.data.html_url);
