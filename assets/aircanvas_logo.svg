<svg xmlns="http://www.w3.org/2000/svg" width="450" height="120" viewBox="0 0 450 120" role="img" aria-label="AirCanvas">
  <defs>
    <linearGradient id="acg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- canvas frame -->
  <rect x="16" y="20" width="80" height="80" rx="18" fill="none" stroke="url(#acg)" stroke-width="7"/>
  <!-- weight blocks streaming onto the canvas -->
  <rect x="32" y="64" width="17" height="17" rx="4" fill="#0ea5e9"/>
  <rect x="53" y="49" width="17" height="17" rx="4" fill="#4f8df2"/>
  <rect x="74" y="34" width="17" height="17" rx="4" fill="#8b5cf6"/>
  <!-- wordmark -->
  <text x="116" y="79" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700"><tspan fill="url(#acg)">Air</tspan><tspan fill="#1e293b">Canvas</tspan></text>
</svg>
