<svg xmlns="http://www.w3.org/2000/svg" width="392" height="500" viewBox="0 0 392 500" role="img" aria-label="AirCanvas">
  <defs>
    <linearGradient id="acg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- billowing canvas: four tapered strokes, tilted (TR tip high, BL tail trailing) -->
  <g fill="url(#acg)">
    <!-- top edge: up-bulge then rising swoop to a sharp top-right tip -->
    <path d="M114,192 C152,156 198,148 240,150 C270,152 294,140 314,126 C290,150 260,164 232,168 C194,174 152,180 114,192 Z"/>
    <!-- right edge: bulges out high, sweeps back in to a pointed bottom end -->
    <path d="M318,138 C342,204 332,290 292,348 C306,290 312,206 318,138 Z"/>
    <!-- bottom edge: under-bulge tapering into a long trailing tail -->
    <path d="M286,352 C232,392 152,392 70,378 C150,374 228,370 286,352 Z"/>
    <!-- left edge: leftward bow, pointed both ends -->
    <path d="M106,200 C88,248 84,298 94,344 C97,298 101,248 106,200 Z"/>
  </g>
  <!-- wordmark -->
  <text x="196" y="452" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="600" fill="#a78bfa">AirCanvas</text>
</svg>
