[project]
name = "aircanvas-studio"
version = "0.1.0"
description = "Local web UI for AirCanvas — stream 20B+ DiTs on 4–8 GB GPUs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aircanvas",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
]

[project.scripts]
aircanvas-studio = "aircanvas_studio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aircanvas_studio"]
